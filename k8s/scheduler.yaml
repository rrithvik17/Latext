apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: latext
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: latext-backend:latest  # shares backend code image
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.scheduler.scheduler"]
          envFrom:
            - configMapRef:
                name: latext-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          terminationGracePeriodSeconds: 30
