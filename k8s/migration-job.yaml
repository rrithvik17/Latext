apiVersion: batch/v1
kind: Job
metadata:
  name: latext-migration-job
  namespace: latext
spec:
  template:
    metadata:
      labels:
        app: latext-migration-job
    spec:
      containers:
        - name: migration
          image: latext-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: latext-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: latext-secrets
                  key: JWT_SECRET
            - name: JWT_ALGORITHM
              valueFrom:
                secretKeyRef:
                  name: latext-secrets
                  key: JWT_ALGORITHM
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                secretKeyRef:
                  name: latext-secrets
                  key: ACCESS_TOKEN_EXPIRE_MINUTES
      restartPolicy: Never
  backoffLimit: 4
