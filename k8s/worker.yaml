apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: latext
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: latext-backend:latest  # shares backend code image
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker.worker"]
          envFrom:
            - configMapRef:
                name: latext-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: latext-secrets
                  key: JWT_SECRET
            - name: JWT_ALGORITHM
              valueFrom:
                secretKeyRef:
                  name: latext-secrets
                  key: JWT_ALGORITHM
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                secretKeyRef:
                  name: latext-secrets
                  key: ACCESS_TOKEN_EXPIRE_MINUTES
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          terminationGracePeriodSeconds: 30
